name: cdp

services:
  php:
    build: ./docker/php
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cdp
      DB_USER: cdp
      DB_PASSWORD: cdp
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    # Dev tuning: the working set (tables + indexes) must fit in the buffer pool
    # (default 128M), and flush the redo log once per second instead of at every
    # commit (up to 1s of writes lost on a crash — acceptable locally, not in prod).
    command:
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-redo-log-capacity=512M
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cdp
      MYSQL_USER: cdp
      MYSQL_PASSWORD: cdp
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # TCP (127.0.0.1), not the socket: during init MySQL runs a socket-only
      # temporary server, which must not be reported as healthy.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dev tool: web UI to browse the database at http://localhost:8081 (auto-login as "cdp").
  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: cdp
      PMA_PASSWORD: cdp
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
